<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百分率與盈虧算式練習機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 text-slate-800">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-indigo-600 px-6 py-5 text-white flex justify-between items-center flex-wrap gap-3">
            <div>
                <h1 class="text-xl font-bold">盈虧與百分率 算式練習機</h1>
                <p class="text-xs text-indigo-100 mt-1">支援算式輸入：180(1-.32、1755/1.34、20%、0.2 (按 Enter 可提交/跳題)</p>
            </div>
            <div class="bg-indigo-700/60 px-3 py-1.5 rounded-lg text-xs font-semibold flex gap-2 items-center">
                <span id="score-text" class="text-green-300 font-bold">答對 0/0</span>
                <span class="text-indigo-200">|</span>
                <span id="progress-text" class="text-indigo-100">第 1/1 題</span>
            </div>
        </div>

        <!-- Controls / Mode Selection -->
        <div class="bg-slate-100 px-6 py-3 border-b border-slate-200 flex flex-wrap gap-2 text-sm">
            <button onclick="setFilter('all')" id="btn-all" class="filter-btn px-3 py-1 rounded-full font-medium transition bg-indigo-600 text-white">全部題型</button>
            <button onclick="setFilter('sp')" id="btn-sp" class="filter-btn px-3 py-1 rounded-full font-medium transition bg-white text-slate-600 hover:bg-slate-200">求售價 (SP)</button>
            <button onclick="setFilter('cp')" id="btn-cp" class="filter-btn px-3 py-1 rounded-full font-medium transition bg-white text-slate-600 hover:bg-slate-200">求成本 (CP)</button>
            <button onclick="setFilter('rate')" id="btn-rate" class="filter-btn px-3 py-1 rounded-full font-medium transition bg-white text-slate-600 hover:bg-slate-200">求利潤/虧損率 (%)</button>
        </div>

        <!-- Question Card -->
        <div class="p-6">
            <div class="flex items-center gap-2 mb-3">
                <span id="q-tag" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200">載入中...</span>
            </div>
            
            <p id="q-text" class="text-lg font-medium leading-relaxed text-slate-800 mb-6">點擊下方按鈕開始產生題目...</p>

            <!-- Input Area -->
            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="flex items-center gap-3">
                    <label for="user-input" class="font-bold text-slate-700 whitespace-nowrap">答案：</label>
                    <div class="relative flex-1">
                        <input type="text" id="user-input" placeholder="輸入數字或算式，如 180(1-.32" 
                               oninput="liveEvaluate()"
                               onkeydown="handleKeyDown(event)"
                               class="w-full border-2 border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 font-medium focus:border-indigo-500 focus:outline-none transition">
                    </div>
                    <button type="submit" id="btn-submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-md hover:shadow">
                        核對答案
                    </button>
                </div>

                <!-- Live Evaluation Bar -->
                <div id="live-eval-box" class="hidden text-xs bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-slate-600 flex justify-between items-center">
                    <span>算式即時計算結果：<strong id="live-eval-val" class="text-indigo-600 text-sm">--</strong></span>
                    <span id="live-eval-percent" class="text-slate-500 font-medium"></span>
                </div>
            </form>

            <!-- Feedback Area -->
            <div id="feedback-box" class="mt-4 hidden p-4 rounded-xl border"></div>

            <!-- Solution Steps Area -->
            <div id="solution-box" class="mt-4 hidden p-4 bg-indigo-50/60 border border-indigo-100 rounded-xl text-sm leading-relaxed text-slate-700">
                <h4 class="font-bold text-indigo-900 mb-2 flex items-center gap-1">
                    <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    解題步驟詳解：
                </h4>
                <div id="solution-text" class="space-y-1"></div>
            </div>

            <!-- Action Buttons (Navigation & History) -->
            <div class="mt-6 flex items-center justify-between pt-4 border-t border-slate-100 flex-wrap gap-3">
                <div class="flex gap-2">
                    <button onclick="prevQuestion()" id="btn-prev" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed">
                        ⬅️ 上一題
                    </button>
                    <button onclick="nextQuestion()" id="btn-next" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-lg transition">
                        下一題 ➡️
                    </button>
                </div>

                <button onclick="toggleSolution()" id="btn-toggle-sol" class="text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-4 py-2 rounded-lg transition ml-auto">
                    顯示解題步驟
                </button>
            </div>
        </div>

        <!-- Help Info -->
        <div class="bg-amber-50 border-t border-amber-100 p-4 text-xs text-amber-800 leading-relaxed">
            💡 <strong>操作小提示：</strong>
            <ul class="list-disc ml-5 mt-1 space-y-0.5 text-amber-700">
                <li>即使漏掉結尾的右括號（如 <code>180(1-.32</code>），系統也會自動補齊計算！</li>
                <li>按下 <strong>Enter 鍵</strong>：未答對時自動<strong>核對答案</strong>；已答對則跳往<strong>下一題</strong>。</li>
            </ul>
        </div>
    </div>

    <script>
        let questionsHistory = [];
        let currentIndex = -1;
        let filterMode = 'all';
        let totalAttemptedSet = new Set();
        let correctSet = new Set();

        const items = ["模型玩具", "智慧手錶", "運動鞋", "手提包", "單眼相機", "藍牙耳機", "遊戲主機", "平板電腦", "自行車", "鍵盤"];

        // 數學算式解析器（自動補齊未閉合的括號）
        function parseMathExpression(expr) {
            if (!expr || typeof expr !== 'string') return NaN;
            let cleaned = expr.replace(/\s+/g, '').replace(/%/g, '/100');
            cleaned = cleaned.replace(/(\d+)\(/g, '$1*(');
            cleaned = cleaned.replace(/\)(\d+)/g, ')*$1');
            cleaned = cleaned.replace(/\)\(/g, ')*(');

            // 自動補齊未閉合的右括號
            const openCount = (cleaned.match(/\(/g) || []).length;
            const closeCount = (cleaned.match(/\)/g) || []).length;
            if (openCount > closeCount) {
                cleaned += ')'.repeat(openCount - closeCount);
            }

            if (!/^[0-9+\-*/.()]+$/.test(cleaned)) return NaN;
            try {
                return Function(`"use strict"; return (${cleaned})`)();
            } catch (e) {
                return NaN;
            }
        }

        function setFilter(mode) {
            filterMode = mode;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-3 py-1 rounded-full font-medium transition bg-white text-slate-600 hover:bg-slate-200';
            });
            document.getElementById(`btn-${mode}`).className = 'filter-btn px-3 py-1 rounded-full font-medium transition bg-indigo-600 text-white';
            
            questionsHistory = [];
            currentIndex = -1;
            totalAttemptedSet.clear();
            correctSet.clear();
            addNewQuestion();
            renderCurrentQuestion();
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function addNewQuestion() {
            let types = ['sp', 'cp', 'rate'];
            let type = filterMode === 'all' ? types[getRandomInt(0, 2)] : filterMode;

            const item = items[getRandomInt(0, items.length - 1)];
            const isProfit = Math.random() > 0.3;
            const ratePercent = getRandomInt(5, 45);
            const rateDecimal = ratePercent / 100;

            let cp, sp, targetDecimalRatio, targetUnit, questionText, tagText, steps = [];

            if (type === 'sp') {
                cp = getRandomInt(10, 200) * 10;
                sp = isProfit ? Math.round(cp * (1 + rateDecimal)) : Math.round(cp * (1 - rateDecimal));
                targetDecimalRatio = sp;
                targetUnit = '元';
                tagText = '求售價 (Selling Price)';
                
                const rateStr = `${ratePercent}%`;
                const typeStr = isProfit ? '溢價（利潤）' : '折價（虧損）';
                questionText = `某商戶購入一件${item}，成本為 $${cp}。若以${typeStr} ${rateStr} 的價格售出，求其售價。`;
                
                steps.push(`1. 識別已知條件：成本 = $${cp}，${isProfit ? '利潤率' : '虧損率'} = ${rateStr}`);
                steps.push(`2. 套用公式：售價 = 成本 × (1 ${isProfit ? '+' : '-'} ${isProfit ? '利潤率' : '虧損率'})`);
                steps.push(`3. 計算過程：$${cp} × (1 ${isProfit ? '+' : '-'} ${rateDecimal}) = $${sp}`);

            } else if (type === 'cp') {
                let baseCp = getRandomInt(10, 150) * 10;
                sp = isProfit ? Math.round(baseCp * (1 + rateDecimal)) : Math.round(baseCp * (1 - rateDecimal));
                
                targetDecimalRatio = isProfit ? sp / (1 + rateDecimal) : sp / (1 - rateDecimal);
                cp = Math.round(targetDecimalRatio);
                targetUnit = '元';
                tagText = '求成本 (Cost Price)';
                
                const rateStr = `${ratePercent}%`;
                const actionStr = isProfit ? `賺取了 ${rateStr} 的利潤` : `遭受了 ${rateStr} 的虧損`;
                questionText = `某商戶以 $${sp} 售出一件${item}，從中${actionStr}。求該${item}的成本。`;
                
                steps.push(`1. 識別已知條件：售價 = $${sp}，${isProfit ? '利潤率' : '虧損率'} = ${rateStr}`);
                steps.push(`2. 套用公式：成本 = 售價 ÷ (1 ${isProfit ? '+' : '-'} ${isProfit ? '利潤率' : '虧損率'})`);
                steps.push(`3. 計算過程：$${sp} ÷ (1 ${isProfit ? '+' : '-'} ${rateDecimal}) ≈ $${cp} (精確值約 ${targetDecimalRatio.toFixed(2)})`);

            } else { // rate
                cp = getRandomInt(10, 100) * 10;
                let diff = getRandomInt(2, 35) * 10;
                if (!isProfit && diff >= cp) diff = Math.floor(cp * 0.4);
                
                sp = isProfit ? cp + diff : cp - diff;
                targetDecimalRatio = Math.abs(sp - cp) / cp;
                targetUnit = '';
                tagText = isProfit ? '求利潤率' : '求虧損率';
                
                questionText = `某商戶購入一件${item}，成本為 $${cp}，最終以 $${sp} 售出。求${isProfit ? '利潤率' : '虧損率'}。`;
                
                const rateDisplay = (targetDecimalRatio * 100).toFixed(2).replace(/\.00$/, '');
                steps.push(`1. 計算金額差：|售價 - 成本| = |$${sp} - $${cp}| = $${Math.abs(sp - cp)}`);
                steps.push(`2. 套用公式：${isProfit ? '利潤率' : '虧損率'} = (金額差 ÷ 成本)`);
                steps.push(`3. 計算過程：$${Math.abs(sp - cp)} ÷ $${cp} = ${targetDecimalRatio.toFixed(4)} (${rateDisplay}%)`);
            }

            const newQ = {
                type, cp, sp, isProfit, targetDecimalRatio, targetUnit, questionText, tagText, steps,
                userInputValue: '',
                isSolved: false,
                feedbackHtml: '',
                feedbackClass: 'mt-4 hidden p-4 rounded-xl border',
                showSolution: false
            };

            questionsHistory.push(newQ);
            currentIndex = questionsHistory.length - 1;
        }

        function renderCurrentQuestion() {
            if (currentIndex < 0 || currentIndex >= questionsHistory.length) return;
            const q = questionsHistory[currentIndex];

            document.getElementById('q-tag').innerText = q.tagText;
            document.getElementById('q-text').innerText = q.questionText;
            document.getElementById('user-input').value = q.userInputValue;
            
            const fb = document.getElementById('feedback-box');
            fb.className = q.feedbackClass;
            fb.innerHTML = q.feedbackHtml;
            if (!q.feedbackHtml) fb.classList.add('hidden');
            else fb.classList.remove('hidden');

            const solBox = document.getElementById('solution-box');
            const solText = document.getElementById('solution-text');
            const btnSol = document.getElementById('btn-toggle-sol');
            if (q.showSolution) {
                solText.innerHTML = q.steps.map(step => `<p>${step}</p>`).join('');
                solBox.classList.remove('hidden');
                btnSol.innerText = '隱藏解題步驟';
            } else {
                solBox.classList.add('hidden');
                btnSol.innerText = '顯示解題步驟';
            }

            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('progress-text').innerText = `第 ${currentIndex + 1}/${questionsHistory.length} 題`;
            updateScoreDisplay();

            document.getElementById('live-eval-box').classList.add('hidden');
        }

        function updateScoreDisplay() {
            const correctCount = correctSet.size;
            const attemptedCount = totalAttemptedSet.size;
            document.getElementById('score-text').innerText = `答對 ${correctCount}/${attemptedCount}`;
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex === questionsHistory.length - 1) {
                addNewQuestion();
            } else {
                currentIndex++;
            }
            renderCurrentQuestion();
        }

        function liveEvaluate() {
            const inputVal = document.getElementById('user-input').value.trim();
            const evalBox = document.getElementById('live-eval-box');
            const evalValSpan = document.getElementById('live-eval-val');
            const evalPercentSpan = document.getElementById('live-eval-percent');

            if (!inputVal) {
                evalBox.classList.add('hidden');
                return;
            }

            const val = parseMathExpression(inputVal);
            if (isNaN(val)) {
                evalBox.classList.remove('hidden');
                evalValSpan.innerText = '算式解析中...';
                evalValSpan.className = 'text-amber-600 text-sm';
                evalPercentSpan.innerText = '';
            } else {
                evalBox.classList.remove('hidden');
                const rounded = Math.round(val * 10000) / 10000;
                evalValSpan.innerText = rounded;
                evalValSpan.className = 'text-indigo-600 text-sm font-bold';
                
                const q = questionsHistory[currentIndex];
                if (q && q.type === 'rate') {
                    evalPercentSpan.innerText = `(= ${(rounded * 100).toFixed(2).replace(/\.00$/, '')}%)`;
                } else {
                    evalPercentSpan.innerText = '';
                }
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const q = questionsHistory[currentIndex];
                if (q.isSolved) {
                    nextQuestion();
                } else {
                    submitAnswer();
                }
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            submitAnswer();
        }

        function submitAnswer() {
            const rawInput = document.getElementById('user-input').value.trim();
            const q = questionsHistory[currentIndex];
            q.userInputValue = rawInput;

            if (!rawInput) return;

            let userVal = parseMathExpression(rawInput);
            const feedback = document.getElementById('feedback-box');

            if (isNaN(userVal)) {
                q.feedbackClass = 'mt-4 p-4 rounded-xl border bg-amber-50 border-amber-200 text-amber-800 text-sm';
                q.feedbackHtml = '⚠️ 請輸入有效的數字或算式（例如：<code>180(1-.32</code>、<code>0.2</code>、<code>20%</code>）。';
                renderCurrentQuestion();
                return;
            }

            const target = q.targetDecimalRatio;
            let isCorrect = false;

            if (q.type === 'rate') {
                isCorrect = Math.abs(userVal - target) < 0.001;
            } else {
                const roundedTarget = Math.round(target);
                isCorrect = (Math.abs(userVal - target) < 0.5) || (Math.abs(userVal - roundedTarget) < 0.5);
            }

            totalAttemptedSet.add(currentIndex);
            if (isCorrect) {
                correctSet.add(currentIndex);
                q.isSolved = true;
            }

            updateScoreDisplay();

            if (isCorrect) {
                const displayVal = q.type === 'rate' 
                    ? `${userVal} (${(userVal * 100).toFixed(2).replace(/\.00$/, '')}%)` 
                    : `${userVal.toFixed(2).replace(/\.00$/, '')} 元`;

                q.feedbackClass = 'mt-4 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 text-sm font-medium flex items-center gap-2';
                q.feedbackHtml = `
                    <svg class="w-6 h-6 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div>
                        <div>恭喜你，回答完全正確！🎉 (按 Enter 鍵可直接跳至下一題)</div>
                        <div class="text-xs text-emerald-600 font-normal mt-0.5">您的輸入求值結果：${displayVal}</div>
                    </div>
                `;
            } else {
                let errorTip = '';
                if (q.type === 'rate' && Math.abs(userVal - (target * 100)) < 0.1) {
                    errorTip = `<br>💡 提示：若輸入整數 <strong>${userVal}</strong>，代表 ${userVal * 100}%。請輸入 <strong>${userVal}%</strong> 或 <strong>${(userVal/100).toFixed(2)}</strong>。`;
                }

                q.feedbackClass = 'mt-4 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-800 text-sm';
                q.feedbackHtml = `
                    <div class="font-bold flex items-center gap-1.5 text-rose-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        答案不對喔！請修改後重新提交（可再次按 Enter）。
                    </div>
                    <div class="text-xs text-rose-600 mt-1">
                        您的算式算出的數值為：<strong>${userVal.toFixed(4).replace(/\.?0+$/, '')}</strong>${errorTip}
                    </div>
                `;
            }

            renderCurrentQuestion();
        }

        function toggleSolution() {
            const q = questionsHistory[currentIndex];
            q.showSolution = !q.showSolution;
            renderCurrentQuestion();
        }

        window.onload = function() {
            addNewQuestion();
            renderCurrentQuestion();
        };
    </script>
</body>
</html>
